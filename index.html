<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Pro</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <header>
            <h1>Vocabulary Pro</h1>
            <nav id="mainNav">
                <button data-section="training">Тренировка</button>
                <button data-section="library">Библиотека</button>
                <button data-section="stats">Статистика</button>
                <button data-section="clusters">Кластеры</button>
            </nav>
        </header>
        <p id="storageStatus" role="status"></p>
        <main>
            <section id="training" class="section">
                <div id="trainingMenu" class="category-grid">
                    <button id="startClassic">🃏 Классический перевод</button>
                    <button id="startArchive">📦 Архив</button>
                    <button id="startSpelling">✍️ Правописание</button>
                    <button id="startRandom" class="random-training-btn">🎲 Случайные слова</button>
                </div>
                <div id="trainingSession" hidden>
                    <button id="stopTraining">← Назад</button>
                    <div id="flashcardsContainer"></div>
                </div>
            </section>
            <section id="library" class="section" hidden>
                <form id="addForm" class="add-word-form">
                    <input id="wordInput" aria-label="Слово" placeholder="Слово" required>
                    <input id="transcriptionInput" aria-label="Транскрипция" placeholder="Транскрипция">
                    <button type="button" id="lookup">Подсказать часть речи</button>
                    <div id="translationsContainer"></div>
                    <button type="button" id="addSense">Добавить вариант перевода</button>
                    <button class="add-btn">Добавить слово</button>
                    <p id="addFeedback" role="status"></p>
                </form>
                <div class="library-controls">
                    <div class="storage-actions">
                        <button id="exportData">Экспорт</button>
                        <button id="importData">Импорт</button>
                        <button id="exportRaw">Скачать исходные данные</button>
                        <input id="importFile" type="file" accept=".json,application/json" hidden>
                    </div>
                    <p id="wordCount"></p>
                    <input id="searchInput" aria-label="Поиск" placeholder="Поиск…">
                    <select id="filterSelect" aria-label="Категория">
                        <option value="ALL">Все категории</option>
                    </select>
                </div>
                <div id="wordsList"></div>
            </section>
            <section id="stats" class="section" hidden>
                <div id="statsContent"></div>
            </section>
            <section id="clusters" class="section" hidden>
                <h2>Семантическая кластеризация</h2>
                <p id="clusterWordCount"></p>
                <form class="add-word-form">
                    <label for="clusterThreshold">Порог косинусного расстояния</label>
                    <input id="clusterThreshold" type="number" min="0.01" max="2" step="0.01" value="0.65" required>
                    <button class="add-btn" disabled>Кластеризовать словарь</button>
                </form>
                <progress id="clusterProgress" aria-label="Вычисление кластеров" hidden></progress>
                <p id="clusterStatus" role="status"></p>
                <div id="clusterResults"></div>
            </section>
        </main>
    </div>
    <dialog id="editModal" aria-labelledby="editTitle">
        <form id="editForm">
            <h3 id="editTitle">Редактирование слова</h3>
            <p id="editStatus" role="status"></p>
            <label for="editWord">Слово</label>
            <input id="editWord" required>
            <label for="editTranscription">Транскрипция</label>
            <input id="editTranscription">
            <div id="editTranslationsContainer"></div>
            <button type="button" id="editSense">Добавить вариант</button>
            <button class="add-btn">Сохранить</button>
            <button type="button" id="cancelEdit">Отмена</button>
        </form>
    </dialog>
    <script type="module" src="script.js"></script>
</body>
</html>
